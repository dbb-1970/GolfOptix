[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep preview maps out of search results; this is not access control.
[[headers]]
  for = "/course-preview/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
