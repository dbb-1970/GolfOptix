[build]
  publish = "public"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep preview maps out of search results; this is not access control.
[[headers]]
  for = "/course-preview/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[build.environment]
  NODE_VERSION = "22"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Crew is private; roster and personnel filtering are also enforced by its API.
[[redirects]]
  from = "/crew/*"
  to = "/crew/:splat"
  status = 200
  force = true
  conditions = {Role = ["admin", "kings-member", "crew"]}
[[redirects]]
  from = "/crew/*"
  to = "/login/?required=crew"
  status = 302
  force = true
[[headers]]
  for = "/crew/*"
  [headers.values]
    Cache-Control = "private, no-store"

# Real maintenance pages require an approved role, including direct HTML URLs.
# The public, fictional Test Drive lives under its own /test-drive/ path.
[[redirects]]
  from = "/maintenance/*"
  to = "/maintenance/:splat"
  status = 200
  force = true
  conditions = {Role = ["admin", "kings-member"]}
[[redirects]]
  from = "/maintenance/*"
  to = "/login/?required=maintenance"
  status = 302
  force = true
[[headers]]
  for = "/maintenance/*"
  [headers.values]
    Cache-Control = "private, no-store"

# Server-enforced access: even direct map URLs require a signed Identity role.
[[redirects]]
  from = "/course/*"
  to = "/course/:splat"
  status = 200
  force = true
  conditions = {Role = ["admin", "kings-member"]}
[[redirects]]
  from = "/course/*"
  to = "/login/?required=course"
  status = 302
  force = true
[[redirects]]
  from = "/course-preview/*"
  to = "/course-preview/:splat"
  status = 200
  force = true
  conditions = {Role = ["admin", "kings-member"]}
[[redirects]]
  from = "/course-preview/*"
  to = "/access-denied/"
  status = 403
  force = true
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = true
  conditions = {Role = ["admin"]}
[[redirects]]
  from = "/admin/*"
  to = "/login/?required=admin"
  status = 302
  force = true
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/course-preview/*"
  [headers.values]
    Cache-Control = "private, no-store"
